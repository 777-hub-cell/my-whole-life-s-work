name: Aharane Android

on:
  pull_request:
    branches: [mscc-azure, feat/aharane-kotlin-native-foundation-20261119]
    paths: ['aharane/android/**', 'aharane/src/**', 'aharane/test/**', 'aharane/package.json', '.github/workflows/aharane-android.yml']
  push:
    branches: [mscc-azure]
    paths: ['aharane/android/**', 'aharane/src/**', 'aharane/test/**', 'aharane/package.json', '.github/workflows/aharane-android.yml']
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build a production-signed APK (requires the four Aharane release signing secrets)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: aharane-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-workflow-tests:
    name: Aharane server logic and workflow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aharane/package.json
      - name: Install server dependencies
        working-directory: aharane
        run: npm install --no-audit --no-fund
      - name: Validate server source and run all tests
        working-directory: aharane
        run: npm run check

  build:
    name: Native Android tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install stable Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        working-directory: aharane/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Enable KVM for Android instrumentation tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Encrypted database, media and offline search instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd aharane/android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Assemble debug APK
        working-directory: aharane/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-debug
          path: aharane/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Build and verify production-signed APK
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Validate and load private signing key
        id: signing
        env:
          AHARANE_RELEASE_KEYSTORE_BASE64: ${{ secrets.AHARANE_RELEASE_KEYSTORE_BASE64 }}
          AHARANE_RELEASE_STORE_PASSWORD: ${{ secrets.AHARANE_RELEASE_STORE_PASSWORD }}
          AHARANE_RELEASE_KEY_ALIAS: ${{ secrets.AHARANE_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${AHARANE_RELEASE_KEYSTORE_BASE64:?Missing secret AHARANE_RELEASE_KEYSTORE_BASE64}"
          : "${AHARANE_RELEASE_STORE_PASSWORD:?Missing secret AHARANE_RELEASE_STORE_PASSWORD}"
          : "${AHARANE_RELEASE_KEY_ALIAS:?Missing secret AHARANE_RELEASE_KEY_ALIAS}"
          : "${{ secrets.AHARANE_RELEASE_KEY_PASSWORD }}"

          KEYSTORE_PATH="$RUNNER_TEMP/aharane-release.jks"
          printf '%s' "$AHARANE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$AHARANE_RELEASE_STORE_PASSWORD" \
            -alias "$AHARANE_RELEASE_KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: aharane/android
        env:
          AHARANE_RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          AHARANE_RELEASE_STORE_PASSWORD: ${{ secrets.AHARANE_RELEASE_STORE_PASSWORD }}
          AHARANE_RELEASE_KEY_ALIAS: ${{ secrets.AHARANE_RELEASE_KEY_ALIAS }}
          AHARANE_RELEASE_KEY_PASSWORD: ${{ secrets.AHARANE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Verify release APK signature
        working-directory: aharane/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-android-release-signed
          path: aharane/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  preview-screenshots:
    name: Run native app and capture real emulator screenshots
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug
          path: artifacts

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            python3 aharane/android/scripts/capture_design_preview.py

      - name: Upload real app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  web-reference-screenshots:
    name: Capture actual web Studio reference at mobile size
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare actual web source
        run: |
          mkdir -p web/aharane/studio
          cp -R aharane/control-centre/. web/aharane/studio/
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture web reference screens
        run: node aharane/android/scripts/capture_web_reference.mjs
      - name: Upload web reference screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aharane-web-reference-screenshots
          path: web-reference-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
