name: Aharane Android

on:
  pull_request:
    branches: [mscc-azure]
    paths: ['aharane/android/**', '.github/workflows/aharane-android.yml']
  push:
    branches: [mscc-azure]
    paths: ['aharane/android/**', '.github/workflows/aharane-android.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: aharane-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native Android tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install stable Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        working-directory: aharane/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: aharane/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-debug
          path: aharane/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  preview-screenshots:
    name: Run native app and capture real emulator screenshots
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from this build
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug
          path: artifacts

      - name: Reuse the last successful APK if this build is blocked
        if: needs.build.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug
          path: artifacts
          repository: 777-hub-cell/my-whole-life-s-work
          run-id: 44581557942
          github-token: ${{ github.token }}

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            adb install artifacts/app-debug.apk
            adb shell am start -n com.aharane.studio/.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshots/01-home.png

            adb shell input tap 324 2232
            sleep 2
            adb exec-out screencap -p > screenshots/02-chats.png
            adb shell input tap 540 2232
            sleep 2
            adb exec-out screencap -p > screenshots/03-files.png
            adb shell input tap 756 2232
            sleep 2
            adb exec-out screencap -p > screenshots/04-env.png
            adb shell input tap 972 2232
            sleep 2
            adb exec-out screencap -p > screenshots/05-more.png

      - name: Upload real app screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
