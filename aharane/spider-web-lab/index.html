<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0d">
<meta name="description" content="Aharane — a short animated splash screen concept.">
<title>Aharane — Splash Screen</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Instrument Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b0d;color:#edf1ef}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0}
body{overflow:hidden;background:#080b0d}
.splash{position:relative;display:grid;place-items:center;width:100%;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 45%,#172126 0%,#0b1115 37%,#080b0d 73%)}
.splash:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 48%,rgba(14,122,92,.10),transparent 47%);animation:background-settle 500ms ease-out both}
.lockup{display:flex;flex-direction:column;align-items:center;gap:25px;padding:32px 20px;text-align:center;transform:translateY(-2vh)}
.emblem{display:block;width:clamp(112px,31vw,154px);height:auto;overflow:visible;opacity:0;transform:scale(.92);animation:emblem-enter 820ms cubic-bezier(.18,.72,.2,1) 40ms forwards}
.rays,.rings,.outer-ring{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.rays{stroke:#dce6e4;stroke-width:1.05;opacity:.7;animation:draw-silk 620ms cubic-bezier(.25,.7,.18,1) 90ms forwards}
.rings{stroke:#dce6e4;stroke-width:1.15;opacity:.9;animation:draw-silk 650ms cubic-bezier(.25,.7,.18,1) 270ms forwards}
.outer-ring{stroke:#89b7a8;stroke-width:1.1;opacity:.75;animation:draw-silk 580ms ease-out 390ms forwards}
.hub{fill:#e3ece8;opacity:0;transform-box:fill-box;transform-origin:center;animation:hub-appear 260ms ease-out 690ms forwards}
.glint{fill:#a9d9c6;opacity:0;filter:drop-shadow(0 0 5px rgba(142,226,195,.45));animation:glint-once 230ms ease-out 860ms forwards}
.wordmark{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(27px,7vw,33px);letter-spacing:.22em;padding-left:.22em;line-height:1;color:#edf1ef;opacity:0;transform:translateY(7px);animation:wordmark-enter 400ms ease-out 500ms forwards}
@keyframes background-settle{from{opacity:.3}to{opacity:1}}
@keyframes emblem-enter{0%{opacity:0;transform:scale(.92)}70%{opacity:1;transform:scale(1.015)}100%{opacity:1;transform:scale(1)}}
@keyframes draw-silk{to{stroke-dashoffset:0}}
@keyframes hub-appear{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)}}
@keyframes glint-once{0%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1.15)}100%{opacity:.62;transform:scale(1)}}
@keyframes wordmark-enter{to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){
 .splash:before,.emblem,.rays,.rings,.outer-ring,.hub,.glint,.wordmark{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<main class="splash" role="main" aria-label="Aharane splash screen">
  <div class="lockup">
    <svg class="emblem" viewBox="0 0 160 160" role="img" aria-label="A fine spider web emblem">
      <g class="rays">
        <path pathLength="1" d="M80 14V146 M47 23L113 137 M23 47L137 113 M14 80H146 M23 113L137 47 M47 137L113 23"/>
      </g>
      <g class="rings">
        <circle pathLength="1" cx="80" cy="80" r="19"/>
        <circle pathLength="1" cx="80" cy="80" r="37"/>
        <circle pathLength="1" cx="80" cy="80" r="55"/>
      </g>
      <circle class="outer-ring" pathLength="1" cx="80" cy="80" r="66"/>
      <circle class="hub" cx="80" cy="80" r="3.1"/>
      <circle class="glint" cx="80" cy="14" r="2"/>
    </svg>
    <div class="wordmark">AHARANE</div>
  </div>
</main>
</body>
</html>
