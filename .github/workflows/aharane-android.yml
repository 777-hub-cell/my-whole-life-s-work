name: Aharane Android

on:
  pull_request:
    branches: [mscc-azure, feat/aharane-kotlin-native-foundation-20261119]
    paths: ['aharane/android/**', 'aharane/src/**', 'aharane/test/**', 'aharane/package.json', '.github/workflows/aharane-android.yml']
  push:
    branches: [mscc-azure]
    paths: ['aharane/android/**', 'aharane/src/**', 'aharane/test/**', 'aharane/package.json', '.github/workflows/aharane-android.yml']
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build a production-signed APK (requires the four Aharane release signing secrets)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: aharane-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-workflow-tests:
    name: Aharane server logic and workflow tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aharane/package.json
      - name: Install server dependencies
        working-directory: aharane
        run: npm install --no-audit --no-fund
      - name: Validate server source and run all tests
        working-directory: aharane
        run: npm run check

  build:
    name: Native Android tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install stable Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        working-directory: aharane/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Enable KVM for Android instrumentation tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Encrypted database, media and offline search instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd aharane/android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Assemble debug APK
        working-directory: aharane/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-debug
          path: aharane/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  unsigned-release:
    name: Build an unsigned production release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK and official signing tools
        run: sdkmanager --install "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build production release APK without any signing key
        working-directory: aharane/android
        run: ./gradlew --no-daemon clean assembleRelease -PaharaneVersionCode=${GITHUB_RUN_NUMBER}
      - name: Verify release build is installable and not debuggable
        working-directory: aharane/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/aharane-badging.txt"
          grep -q "package: name='com.aharane.studio'" "$RUNNER_TEMP/aharane-badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/aharane-badging.txt"; then
            echo "Release candidate is incorrectly debuggable" >&2
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Stage official Android APK signing utility
        run: |
          set -euo pipefail
          mkdir -p release-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" release-tools/
          cp -R "$ANDROID_HOME/build-tools/36.0.0/lib/." release-tools/lib/
          chmod 755 release-tools/apksigner
      - name: Upload unsigned production APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: aharane-production-release-unsigned
          path: aharane/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload official Android APK signing utility
        uses: actions/upload-artifact@v4
        with:
          name: aharane-apksigner-tool
          path: release-tools/**
          if-no-files-found: error
          retention-days: 7

  preview-screenshots:
    name: Run native app and capture real emulator screenshots
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug
          path: artifacts

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            python3 aharane/android/scripts/capture_design_preview.py

      - name: Upload real app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

  web-reference-screenshots:
    name: Capture actual web Studio reference at mobile size
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare actual web source
        run: |
          mkdir -p web/aharane/studio
          cp -R aharane/control-centre/. web/aharane/studio/
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture web reference screens
        run: node aharane/android/scripts/capture_web_reference.mjs
      - name: Upload web reference screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aharane-web-reference-screenshots
          path: web-reference-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
