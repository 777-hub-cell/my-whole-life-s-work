name: MSCC Dramaday catalogue source check

on:
  workflow_dispatch:
  push:
    branches:
      - mscc-azure
    paths:
      - 'mscc/sources/tv/dramaday.js'
      - 'mscc/dramaday-catalog-selftest.js'
      - 'mscc/tv-flow.js'
      - 'mscc/package.json'
      - '.github/workflows/mscc-dramaday-catalog.yml'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install MSCC dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Check Dramaday adapter syntax and behavior
        working-directory: mscc
        run: |
          node --check sources/tv/dramaday.js
          node --check tv-flow.js
          node dramaday-catalog-selftest.js
      - name: Run TV command-flow regressions
        working-directory: mscc
        run: node tv-flow-selftest.js
