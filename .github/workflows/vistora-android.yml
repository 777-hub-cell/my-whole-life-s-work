name: VISTORA Android

on:
  pull_request:
    paths:
      - "vistora/**"
      - ".github/workflows/vistora-android.yml"
      - "aharane/android/gradlew"
      - "aharane/android/gradle/**"
  push:
    branches:
      - "feature/vistora-kotlin-native-android-20261122"
    paths:
      - "vistora/**"
      - ".github/workflows/vistora-android.yml"
      - "aharane/android/gradlew"
      - "aharane/android/gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests and Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            vistora/android/**/*.gradle*
            vistora/android/gradle/**
            vistora/android/gradle.properties
            aharane/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow the shared Gradle wrapper to execute
        run: chmod +x aharane/android/gradlew

      - name: Assemble debug APK
        run: bash vistora/android/gradlew :app:assembleDebug

      - name: Run unit tests
        run: bash vistora/android/gradlew :app:testDebugUnitTest

      - name: Run Android lint
        run: bash vistora/android/gradlew :app:lintDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vistora-debug-apk
          path: vistora/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
