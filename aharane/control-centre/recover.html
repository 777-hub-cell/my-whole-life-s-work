<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Restore Aharane Local Studio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f6;color:#171717;font:15px/1.6 system-ui}.panel{width:min(100%,480px);padding:26px;background:white;border:1px solid #e5e5e1;border-radius:7px}button{min-height:44px;padding:0 16px;border:1px solid #171717;border-radius:5px;background:#171717;color:white;font-weight:700}p{color:#666;font-size:13px}</style></head><body><main class="panel"><p>AHARANE LOCAL STUDIO · RECOVERY</p><h1>Restore the original app</h1><p>This clears local edits to app HTML, CSS, JavaScript and manifest. Project files and bot data are not affected.</p><button id="restore">Clear app edits and restore</button><p id="status" role="status"></p></main><script>document.getElementById('restore').addEventListener('click',()=>{const s=document.getElementById('status'),r=indexedDB.open('aharane-local-studio');r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'path'});if(!d.objectStoreNames.contains('appOverrides'))d.createObjectStore('appOverrides',{keyPath:'path'})};r.onerror=()=>s.textContent='Could not open local storage.';r.onsuccess=()=>{const d=r.result;if(!d.objectStoreNames.contains('appOverrides')){d.close();location.replace('/aharane/studio/');return}const t=d.transaction('appOverrides','readwrite');t.objectStore('appOverrides').clear();t.oncomplete=()=>{d.close();location.replace('/aharane/studio/')};t.onerror=()=>{d.close();s.textContent='Restore failed.'}}})</script></body></html>
