name: MSCC Azure

on:
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-azure.yml'
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-azure.yml'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Choose "deploy" only after reviewing the validated mscc-azure commit.'
        required: true
        type: choice
        options: [hold, deploy]
        default: hold

permissions:
  contents: read

concurrency:
  group: mscc-azure-${{ github.ref }}
  # Never interrupt a VM installation halfway through because another push arrived.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      release_ready: ${{ steps.release_gate.outputs.release_ready }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # PRs and merge pushes only validate. A manual production dispatch
      # must use a release manifest prepared against this exact first parent;
      # stale manifests cannot authorize deployment, even with confirmation.
      - name: Validate exact-base release manifest
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          manifest_changed=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git diff --name-only HEAD^ HEAD -- mscc/release-batch.json | grep -Fxq mscc/release-batch.json; then
              manifest_changed=true
            fi
          fi
          MSCC_RELEASE_MANIFEST_CHANGED="$manifest_changed" node mscc/tools/mscc-release-manifest-gate.mjs
      - name: Install MSCC dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Set up FFmpeg for Nexia sticker rendering regression
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
          token: ${{ github.token }}
      - name: Verify FFmpeg tools
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install Noto and FreeSerif fonts for renderer regression
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu images already carry apt package indexes.
          # Avoid apt-get update here: reaching external mirrors has timed out
          # before any project tests could start.
          if ! test -f /usr/share/fonts/truetype/freefont/FreeSerif.ttf || \
             ! test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf || \
             ! test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf; then
            apt_options=(
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o DPkg::Lock::Timeout=60
            )
            sudo timeout --signal=TERM --kill-after=15s 180s apt-get "${apt_options[@]}" install -y -qq --no-install-recommends fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf fontconfig
          fi
          sudo fc-cache -f
          test -f /usr/share/fonts/truetype/freefont/FreeSerif.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
      - name: Check complete runtime and command regression suite
        working-directory: mscc
        run: npm run check
      - name: Verify account registry, lifecycle, identity and routing
        working-directory: mscc
        run: |
          npm run check:sessions
          npm run check:inbound
          npm run check:routing
          npm run check:account-controls
          node session-diagnostics-selftest.js
      - name: Verify shared utilities and source selection
        working-directory: mscc
        run: |
          npm run check:utils
          npm run check:sources
          npm run check:series-flow
      - name: Verify independent pairing and lyrics regressions
        working-directory: mscc
        run: |
          node music-flow-selftest.js
          node account-controls-selftest.js
          node panel-login-throttle-selftest.js
      - name: Validate Azure installer and source helper scripts
        working-directory: mscc
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-azure.sh tools/install-flaresolverr-tor.sh tools/test-animepahe-azure.sh tools/install-night-play-ingress.sh
          bash -n tools/install-node-deps.sh tools/install-node-deps-selftest.sh
          bash tools/install-node-deps-selftest.sh
          bash -n tools/deploy-azure-ssh.sh tools/deploy-azure-ssh-selftest.sh
          bash tools/deploy-azure-ssh-selftest.sh
          bash -n tools/mscc-github-deploy-wrapper.sh tools/mscc-github-deploy-wrapper-selftest.sh tools/azure-main-ssh-monitor.sh tools/azure-main-ssh-monitor-selftest.sh
          bash -n tools/azure-cortex-cloud-bootstrap.sh tools/azure-cortex-cloud-bootstrap-selftest.sh
          bash tools/azure-cortex-cloud-bootstrap-selftest.sh
          bash tools/azure-main-ssh-monitor-selftest.sh
          bash tools/azure-singleton-flock-selftest.sh
          bash tools/mscc-github-deploy-wrapper-selftest.sh
          node youtube-tor-delivery-selftest.js
          node --check youtube-knight-providers.js
          node youtube-knight-selftest.js
          node --check tools/azure-knight-diagnostics.mjs
          node --check tools/azure-youtube-diagnostics.mjs
          node tools/azure-youtube-diagnostics-selftest.mjs
          node --check tools/azure-main-diagnostics.mjs
          node --check tools/azure-main-diagnostics-selftest.mjs
          node tools/azure-main-diagnostics-selftest.mjs
          grep -Fq 'mscc-github-deploy-wrapper.sh' install-azure.sh
          bash -n tools/azure-release-switch-selftest.sh
          bash tools/azure-release-switch-selftest.sh
          bash -n tools/azure-config-rollback-selftest.sh
          bash tools/azure-config-rollback-selftest.sh
          bash -n tools/azure-cortex-acl-selftest.sh
          bash tools/azure-cortex-acl-selftest.sh
          bash -n tools/azure-source-stack-reuse-selftest.sh
          bash tools/azure-source-stack-reuse-selftest.sh
          bash -n tools/install-personality-art.sh tools/personality-art-selftest.sh
          command -v ffmpeg >/dev/null 2>&1 || {
            echo 'FFmpeg was not added to PATH by the setup step.' >&2
            exit 1
          }
          bash tools/personality-art-selftest.sh
          node tools/azure-smoke-selftest.mjs
          grep -Fq 'readlink -f "$BASE/current/tools/azure-smoke.mjs"' install-azure.sh
          grep -Eq '^VERSION="[0-9]+\.[0-9]+\.[0-9]+"$' install-azure.sh
          grep -Fq 'SOURCE_REF="${MSCC_SOURCE_REF:-mscc-azure}"' install-azure.sh
          grep -Fq 'archive/$SOURCE_REF.tar.gz' install-azure.sh
          ! grep -Fq 'CC_DESTINATION_ACCOUNT' index.js
          ! grep -Fq 'CC_DESTINATION_ACCOUNT' .env.example
          grep -Fq 'fixedCcDestination: true' index.js
          grep -Fq 'changeCcDestination: false' index.js
          grep -Fq 'perAccountCcOverride: false' index.js
          test -d commands
          test -d private-commands
      - name: Build chess renderer proof
        working-directory: mscc
        run: node chess-preview.js
      - name: Upload chess renderer preview
        uses: actions/upload-artifact@v4
        with:
          name: mscc-chess-preview
          path: mscc/artifacts/chess-preview.png
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy tested MSCC commit to Azure
    needs: validate
    # Merges only validate. Production deployment requires a separate manual
    # workflow_dispatch on mscc-azure and the explicit "deploy" confirmation.
    # The exact release manifest is revalidated on that manual run as well.
    # PRs and ordinary pushes never receive server credentials or deploy.
    if: github.ref == 'refs/heads/mscc-azure' && needs.validate.outputs.release_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: mscc-production
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: SSH deploy (verified host key, pinned commit, health + rollback)
        env:
          MSCC_SSH_HOST: ${{ secrets.MSCC_SSH_HOST }}
          MSCC_SSH_USER: ${{ secrets.MSCC_SSH_USER }}
          MSCC_SSH_KEY: ${{ secrets.MSCC_SSH_KEY }}
          MSCC_SSH_KNOWN_HOSTS: ${{ secrets.MSCC_SSH_KNOWN_HOSTS }}
          MSCC_SSH_PORT: ${{ vars.MSCC_SSH_PORT }}
        run: bash mscc/tools/deploy-azure-ssh.sh
