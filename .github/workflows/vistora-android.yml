name: VISTORA Android

on:
  pull_request:
    paths:
      - "vistora/**"
      - ".github/workflows/vistora-android.yml"
      - "aharane/android/gradlew"
      - "aharane/android/gradle/**"
  push:
    branches:
      - "feature/vistora-kotlin-native-android-20261122"
      - "feature/vistora-android-visual-fidelity-20261122"
    paths:
      - "vistora/**"
      - ".github/workflows/vistora-android.yml"
      - "aharane/android/gradlew"
      - "aharane/android/gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests and Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            vistora/android/**/*.gradle*
            vistora/android/gradle/**
            vistora/android/gradle.properties
            aharane/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow the shared Gradle wrapper to execute
        run: chmod +x aharane/android/gradlew

      - name: Set up Android SDK tools and API 37.0
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Add Android 37 compatibility path for Gradle
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"


      - name: Assemble debug APK
        run: bash vistora/android/gradlew :app:assembleDebug

      # Publish the installable APK as soon as assembly succeeds. Later test/lint
      # failures must not prevent the user from receiving the built app.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vistora-debug-apk
          path: vistora/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: bash vistora/android/gradlew :app:testDebugUnitTest

      - name: Run Android lint
        run: bash vistora/android/gradlew :app:lintDebug

      # Expose KVM when the hosted runner provides it. The emulator action's
      # auto mode then uses hardware acceleration instead of a very slow TCG
      # boot; the environment variable below permits TCG when KVM is absent.
      - name: Enable KVM access when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            echo "KVM access enabled for the emulator runner."
          else
            echo "KVM is unavailable; the emulator will use TCG software mode."
          fi

      - name: Run Room instrumentation tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            bash vistora/android/gradlew :app:connectedDebugAndroidTest
            mkdir -p "${RUNNER_TEMP}/vistora-android-qa"
            SCREENSHOT_DIR="$(adb shell 'find /sdcard/Android/data -type d -name vistora-qa 2>/dev/null | head -n 1' | tr -d '\r')" && [ -n "$SCREENSHOT_DIR" ] && adb pull "$SCREENSHOT_DIR" "${RUNNER_TEMP}/vistora-android-qa"
      - name: Upload Android visual screenshots
        uses: actions/upload-artifact@v6
        with:
          name: vistora-android-visual-screenshots
          path: ${{ runner.temp }}/vistora-android-qa/**/*.png
          if-no-files-found: error
          retention-days: 14
