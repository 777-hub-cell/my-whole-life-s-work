name: Aharane Android

on:
  pull_request:
    branches: [mscc-azure]
    paths: ['aharane/android/**', '.github/workflows/aharane-android.yml']
  push:
    branches: [mscc-azure]
    paths: ['aharane/android/**', '.github/workflows/aharane-android.yml']

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Native Android tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install stable Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        working-directory: aharane/android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: aharane/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-debug
          path: aharane/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  preview-screenshots:
    name: Run native app and capture real emulator screenshots
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from this build
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug
          path: artifacts

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            adb install artifacts/app-debug.apk
            adb shell am start -n com.aharane.studio/.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshots/01-home.png

            adb shell input tap 324 2232
            sleep 2
            adb exec-out screencap -p > screenshots/02-chats.png

            adb shell input tap 540 2232
            sleep 2
            adb exec-out screencap -p > screenshots/03-files.png

            adb shell uiautomator dump /sdcard/aharane-window.xml >/dev/null 2>&1
            adb shell cat /sdcard/aharane-window.xml > /tmp/aharane-window.xml
            grep -q 'text="Open editor"' /tmp/aharane-window.xml || { adb shell input swipe 540 2000 540 1100 300; sleep 1; adb shell uiautomator dump /sdcard/aharane-window.xml >/dev/null 2>&1; adb shell cat /sdcard/aharane-window.xml > /tmp/aharane-window.xml; }
            python3 -c "import re,subprocess,xml.etree.ElementTree as ET; root=ET.parse('/tmp/aharane-window.xml').getroot(); node=next((n for n in root.iter('node') if n.attrib.get('text') == 'Open editor' or n.attrib.get('content-desc') == 'Open editor'),None); assert node is not None, 'Could not locate native Open editor control'; bounds=re.search(r'\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]',node.attrib.get('bounds','')); assert bounds, 'Open editor has no screen bounds'; x1,y1,x2,y2=map(int,bounds.groups()); subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)"
            sleep 3
            adb exec-out screencap -p > screenshots/03a-editor.png
            adb shell input keyevent 4
            sleep 1

            adb shell input tap 756 2232
            sleep 2
            adb exec-out screencap -p > screenshots/04-env.png
            adb shell input tap 972 2232
            sleep 2
            adb exec-out screencap -p > screenshots/05-more.png

      - name: Upload real app screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
