name: MSCC Integrated Readiness

on:
  pull_request:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-integrated-readiness.yml'
  push:
    branches: [mscc-azure]
    paths:
      - 'mscc/**'
      - '.github/workflows/mscc-integrated-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install MSCC dependencies
        working-directory: mscc
        run: npm install --no-audit --no-fund
      - name: Set up FFmpeg for Nexia sticker rendering regression
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: release
          token: ${{ github.token }}
      - name: Verify FFmpeg tools
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install Nexia chess piece and social card fonts
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f /usr/share/fonts/truetype/freefont/FreeSerif.ttf || \
             ! test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf || \
             ! test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf; then
            apt_options=(
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o DPkg::Lock::Timeout=60
            )
            sudo timeout --signal=TERM --kill-after=15s 180s apt-get "${apt_options[@]}" install -y -qq --no-install-recommends fontconfig fonts-freefont-ttf fonts-noto-core fonts-noto-color-emoji
          fi
          sudo fc-cache -f
          test -f /usr/share/fonts/truetype/freefont/FreeSerif.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
      - name: Verify merged MSCC runtime and command regression suite
        working-directory: mscc
        run: npm run check
      - name: Verify account identity, registry and session lifecycle
        working-directory: mscc
        run: npm run check:sessions && npm run check:routing
      - name: Verify Cortex account-control mutation security
        working-directory: mscc
        run: npm run check:account-controls
      - name: Verify per-account diagnostics isolation
        working-directory: mscc
        run: node session-diagnostics-selftest.js
      - name: Verify pairing and lyrics baseline regressions
        working-directory: mscc
        run: node music-flow-selftest.js && node session-selftest.js
