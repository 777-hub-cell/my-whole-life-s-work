name: Aharane Native APK and Screenshots

on:
  push:
    branches: [aharane/source-import-20261125]
    paths:
      - 'aharane/android/**'
      - '.github/workflows/aharane-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  debug-apk:
    name: Build installable Aharane debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK platform and tools
        run: sdkmanager --install "platforms;android-36" "platform-tools"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble installable debug APK
        working-directory: aharane/android
        run: sh ./ci-gradle-retry.sh assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-debug-deliverable
          path: aharane/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  screenshots:
    name: Run Aharane on emulator and capture real screens
    needs: [debug-apk]
    if: needs.debug-apk.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: aharane-native-android-debug-deliverable
          path: artifacts
      - name: Run native app and capture screens
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -eu
            mkdir -p screenshots
            export AHARANE_COMMAND_BUILDER_ONLY=1
            python3 aharane/android/scripts/capture_design_preview.py
      - name: Upload real native app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aharane-native-android-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
